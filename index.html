<style>
  :root { --bg: #0c0c0c; --card: #ffffff; --yellow: #ffd700; --yellow-dim: #e6c200; --suspected: #fff8e7; --mark: #ff3b30; --mark-hover: #ff5a52; --text: #111; --muted: #666; --surface: #161616; --border: #2a2a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(ellipse at top, #1a1a1a 0%, #0c0c0c 60%); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Hiragino Sans", "Microsoft JhengHei", sans-serif; line-height: 1.45; min-height: 100vh; }
  .container { max-width: 920px; margin: 0 auto; padding: 24px 16px 80px; }
  header { text-align: center; margin-bottom: 20px; }
  .date { color: var(--yellow); font-weight: 600; font-size: 0.9rem; letter-spacing: 0.5px; margin-bottom: 6px; }
  h1 { font-size: clamp(2rem, 7vw, 3rem); margin: 0 0 10px; font-weight: 900; letter-spacing: -1px; line-height: 1.1; }
  h1 span { color: var(--yellow); }
  .subtitle { font-size: 0.95rem; opacity: 0.8; max-width: 560px; margin: 0 auto 8px; }
  .badge { display: inline-block; background: #2a2a2a; color: #bbb; font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; margin-left: 6px; vertical-align: middle; }
  .tabs { display: flex; justify-content: center; gap: 8px; margin: 12px 0 16px; }
  .tab { background: #1e1e1e; color: #aaa; border: 1px solid #333; padding: 10px 22px; border-radius: 999px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
  .tab.active { background: var(--yellow); color: #000; border-color: var(--yellow); }
  .controls { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; margin: 8px 0 16px; }
  select, button { background: #1e1e1e; color: #fff; border: 1px solid #333; padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 0.92rem; cursor: pointer; font-family: inherit; transition: all 0.15s ease; }
  select:hover, button.secondary:hover { border-color: #555; background: #252525; }
  button { background: var(--yellow); color: #000; border: none; }
  button:hover { background: var(--yellow-dim); }
  button.secondary { background: #1e1e1e; color: #fff; }
  button:active { transform: scale(0.97); }
  .view { display: none; }
  .view.active { display: block; }
  .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 8px 0 20px; }
  .cell { background: var(--card); color: var(--text); border-radius: 14px; padding: 8px 6px; text-align: center; aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; cursor: pointer; transition: all 0.18s cubic-bezier(0.2, 0.8, 0.2, 1); position: relative; user-select: none; border: 2px solid transparent; box-shadow: 0 2px 8px rgba(0,0,0,0.15); overflow: hidden; }
  .cell:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.25); }
  .cell.marked { background: var(--mark); color: #fff; border-color: #ff6b6b; box-shadow: 0 4px 16px rgba(255,59,48,0.35); }
  .cell.marked:hover { background: var(--mark-hover); }
  .cell.suspected { background: var(--suspected); }
  .cell.suspected.marked { background: #ffcc00; color: #000; border-color: #e6b800; }
  .month { font-size: 0.75rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
  .cell.marked .month { color: rgba(255,255,255,0.85); }
  .cell.suspected .month { color: #888; }
  .name { font-weight: 700; font-size: 0.95rem; line-height: 1.25; margin-bottom: 3px; word-break: break-word; hyphens: auto; }
  .detail { font-size: 0.78rem; opacity: 0.85; line-height: 1.25; word-break: break-word; }
  .sus-tag { position: absolute; top: 6px; right: 6px; background: #000; color: #fff; font-size: 0.58rem; padding: 2px 5px; border-radius: 4px; font-weight: 600; }
  .check { position: absolute; top: 6px; left: 6px; width: 18px; height: 18px; background: #fff; color: var(--mark); border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; line-height: 1; }
  .cell.marked .check { display: flex; }
  .stats { text-align: center; margin: 12px 0 20px; font-size: 1.05rem; background: var(--surface); padding: 14px; border-radius: 14px; border: 1px solid var(--border); }
  .bingo-text { font-size: 1.7rem; font-weight: 900; color: var(--yellow); margin: 10px 0 0; display: none; }
  .bingo-text.show { display: block; animation: pop 0.5s ease; }
  @keyframes pop { 0% { transform: scale(0.85); opacity: 0; } 60% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 8px 0 20px; }
  .result-panel { background: var(--surface); border-radius: 16px; padding: 18px; margin: 16px 0; display: none; border: 1px solid var(--border); }
  .result-panel.show { display: block; }
  .result-panel h3 { margin: 0 0 12px; color: var(--yellow); font-size: 1.12rem; font-weight: 800; }
  .type-summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #333; }
  .type-badge { background: #2a2a2a; color: #ffd700; font-size: 0.82rem; padding: 4px 10px; border-radius: 999px; font-weight: 600; }
  .type-badge strong { color: #fff; margin-left: 4px; }
  .badges { margin: 6px 0 4px; }
  .mini-badge { display: inline-block; background: #333; color: #ffd700; font-size: 0.68rem; padding: 2px 7px; border-radius: 999px; margin-right: 5px; font-weight: 600; }
  .result-item { background: #1c1c1c; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border-left: 3px solid var(--yellow); }
  .result-item .org { font-weight: 700; font-size: 1.1rem; }
  .result-item .meta { font-size: 0.9rem; color: #aaa; margin: 3px 0; }
  .result-item .leaked { font-size: 0.88rem; color: #ff8a80; margin-top: 4px; line-height: 1.45; }
  /* Timeline */
  .timeline { position: relative; padding-left: 32px; margin: 12px 0 24px; }
  .timeline::before { content: ''; position: absolute; left: 12px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(to bottom, #ffd70055, #333); }
  .tl-item { position: relative; background: #1a1a1a; border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; border: 1px solid #2a2a2a; cursor: pointer; transition: all 0.18s ease; }
  .tl-item:hover { border-color: #555; background: #1f1f1f; transform: translateX(3px); }
  .tl-item.marked { background: #2a1512; border-color: #ff3b30; }
  .tl-item::before { content: ''; position: absolute; left: -24px; top: 20px; width: 14px; height: 14px; border-radius: 50%; background: #444; border: 3px solid #111; box-shadow: 0 0 0 2px #333; }
  .tl-item.marked::before { background: #ff3b30; box-shadow: 0 0 0 2px #ff3b30; }
  .tl-date { font-size: 0.8rem; color: var(--yellow); font-weight: 700; margin-bottom: 6px; letter-spacing: 0.3px; }
  .tl-name { font-weight: 800; font-size: 1.1rem; margin-bottom: 4px; }
  .tl-detail { font-size: 0.86rem; color: #bbb; margin-bottom: 8px; }
  .tl-leaked { font-size: 0.84rem; color: #ff9a90; line-height: 1.5; margin-bottom: 6px; }
  .tl-source { font-size: 0.75rem; color: #888; }
  .tl-source a { color: #ffd700; text-decoration: none; }
  .tl-source a:hover { text-decoration: underline; }
  .disclaimer { font-size: 0.7rem; color: #666; text-align: center; margin-top: 28px; line-height: 1.5; max-width: 520px; margin-left: auto; margin-right: auto; opacity: 0.85; }
  .share-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; backdrop-filter: blur(4px); }
  .share-modal.show { display: flex; }
  .modal-content { background: #141414; border-radius: 18px; padding: 22px; max-width: 440px; width: 100%; text-align: center; border: 1px solid #2a2a2a; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .modal-content h3 { margin: 0 0 12px; color: var(--yellow); }
  .modal-content textarea { width: 100%; height: 160px; background: #1e1e1e; color: #eee; border: 1px solid #333; border-radius: 10px; padding: 12px; margin: 8px 0 14px; font-family: inherit; resize: vertical; font-size: 0.9rem; line-height: 1.45; }
  @media (max-width: 640px) { .bingo-grid { gap: 6px; } .cell { padding: 6px 4px; border-radius: 11px; } .name { font-size: 0.7rem; } .detail { font-size: 0.58rem; } .month { font-size: 0.58rem; } .container { padding: 16px 10px 50px; } h1 { font-size: 1.75rem; } .subtitle { font-size: 0.88rem; } .controls { gap: 8px; } select, button { padding: 10px 12px; font-size: 0.88rem; } .stats { padding: 12px; font-size: 1rem; } .result-panel { padding: 14px; } .timeline { padding-left: 22px; } }
  @media (max-width: 400px) { .bingo-grid { gap: 4px; } .cell { padding: 4px 3px; } .name { font-size: 0.64rem; } .detail { font-size: 0.54rem; } .check { width: 14px; height: 14px; font-size: 9px; top: 3px; left: 3px; } .sus-tag { top: 3px; right: 3px; font-size: 0.48rem; padding: 1px 3px; } .container { padding: 14px 8px 40px; } h1 { font-size: 1.6rem; } }
  @media (max-width: 360px) { .name { font-size: 0.6rem; } .detail { font-size: 0.5rem; } }
</style>

<body>
<div class="container">
  <header>
    <div class="date">2026年9月 → 11月</div>
    <h1>香港資料外洩 <span>BINGO</span></h1>
    <div class="subtitle">剔走你有份嘅，連成一線就 BINGO</div>
    <div class="hint">Bingo 只顯示最新 25 宗 · <span class="badge">疑 未經證實</span></div>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('bingo')">Bingo</div>
    <div class="tab" onclick="switchTab('timeline')">Timeline</div>
  </div>

  <div class="view active" id="view-bingo">
    <div class="controls">
      <label>排序： <select id="sortSelect" onchange="changeSort()"><option value="date" selected>按日期（新→舊）</option><option value="date-asc">按日期（舊→新）</option><option value="impact">按影響人數（多→少）</option><option value="name">按機構名稱</option></select></label>
      <button class="secondary" onclick="toggleResult()" id="toggleBtn">隱藏洩漏資料清單</button>
    </div>
    <div class="bingo-grid" id="grid"></div>
    <div class="stats">已標記：<strong id="count">0</strong> 格<div class="bingo-text" id="bingoText">BINGO！你中招啦！</div></div>
  </div>

  <div class="view" id="view-timeline">
    <div class="controls">
      <button class="secondary" onclick="toggleResult()" id="toggleBtn2">隱藏洩漏資料清單</button>
    </div>
    <div class="timeline" id="timeline"></div>
  </div>

  <div class="result-panel show" id="resultPanel"><h3>你標記嘅案件 · 洩漏資料一覽</h3><div id="resultList"></div></div>
  <div class="actions"><button onclick="shareResult()">複製報告</button><button class="secondary" onclick="resetCard()">重置</button></div>
  <div class="disclaimer">
    資料來源：私隱專員公署及各傳媒報道，截至2026年11月28日。人數多為初步估計。<br>
    「疑」= 未經機構或私隱署證實。本遊戲僅供娛樂及提高私隱意識，唔代表你實際受影響。<br>
    建議提防「精準詐騙」，唔好隨便提供敏感資料。<br>
    <br>
    Design idea from <a href="https://www.threads.com/@chow_mw" target="_blank" rel="noopener" style="color:#ffd700;text-decoration:underline;">@chow_mw</a>
  </div>
</div>
<div class="share-modal" id="shareModal"><div class="modal-content"><h3>複製你嘅 Bingo 報告</h3><div id="reportImageContainer" style="margin: 12px 0; text-align: center;"></div><textarea id="shareText" readonly></textarea><div class="actions"><button onclick="copyShare()">複製文字 + 連結</button><button class="secondary" onclick="downloadReport()">下載報告圖</button><button class="secondary" onclick="closeModal()">關閉</button></div></div></div>
<script>
let cases = [];
let marked = [];
let currentView = 'bingo';

async function loadCases() {
  try {
    const res = await fetch('cases.json');
    cases = await res.json();
    marked = Array(cases.length).fill(false);
    loadFromURL();
    renderGrid();
  } catch (e) {
    console.error('Failed to load cases.json', e);
    document.getElementById('grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;">載入案件數據失敗，請刷新頁面</div>';
  }
}

function parseDate(d) {
  if (!d) return 0;
  const parts = d.split('-');
  if (parts.length === 3) return new Date(d).getTime();
  if (parts.length === 2) return new Date(d + '-15').getTime();
  return new Date(d + '-06-15').getTime();
}

function formatDate(d) {
  if (!d) return '';
  return d.replace(/-/g, '/');
}

function getLatest25Indices() {
  return cases.map((c, i) => ({i, t: parseDate(c.date)})).sort((a, b) => b.t - a.t).slice(0, 25).map(x => x.i);
}

function getSortedIndices() {
  const latest = getLatest25Indices();
  const sort = document.getElementById('sortSelect')?.value || 'date';
  let arr = latest.map(i => ({i, c: cases[i]}));
  if (sort === 'date') arr.sort((a, b) => parseDate(b.c.date) - parseDate(a.c.date));
  else if (sort === 'date-asc') arr.sort((a, b) => parseDate(a.c.date) - parseDate(b.c.date));
  else if (sort === 'impact') arr.sort((a, b) => (b.c.impact || 0) - (a.c.impact || 0));
  else if (sort === 'name') arr.sort((a, b) => a.c.name.localeCompare(b.c.name, 'zh-HK'));
  return arr.map(x => x.i);
}

function getDataTypesForCase(c) {
  const text = (c.leaked || '') + ' ' + (c.detail || '');
  const types = [];
  if (/姓名|名稱/.test(text)) types.push('姓名');
  if (/身份證|身份證明|ID/i.test(text)) types.push('身份證');
  if (/電話|手機|聯絡/.test(text)) types.push('電話');
  if (/電郵|email/i.test(text)) types.push('電郵');
  if (/信用卡|卡號/.test(text)) types.push('信用卡');
  if (/地址|住址/.test(text)) types.push('地址');
  if (/出生|生日/.test(text)) types.push('出生日期');
  if (/健康|病歷|醫療/.test(text)) types.push('健康');
  if (/相片|照片/.test(text)) types.push('相片');
  if (/財務|銀行|戶口|自動增值/.test(text)) types.push('財務');
  if (types.length === 0) types.push('其他');
  return types;
}

function switchTab(view) {
  currentView = view;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelector(`.tab:nth-child(${view === 'bingo' ? 1 : 2})`).classList.add('active');
  document.getElementById('view-' + view).classList.add('active');
  if (view === 'bingo') renderGrid();
  else renderTimeline();
  updateResult();
}

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  const order = getSortedIndices();
  order.forEach((origIdx, pos) => {
    const c = cases[origIdx];
    const cell = document.createElement('div');
    cell.className = 'cell' + (c.suspected ? ' suspected' : '') + (marked[origIdx] ? ' marked' : '');
    cell.innerHTML = `
      <div class="check">✓</div>
      ${c.suspected ? '<div class="sus-tag">疑</div>' : ''}
      <div class="month">${c.month}</div>
      <div class="name">${c.name.replace(/\n/g, '<br>')}</div>
      <div class="detail">${c.detail}</div>
    `;
    cell.onclick = () => {
      marked[origIdx] = !marked[origIdx];
      renderGrid();
      updateURL();
    };
    grid.appendChild(cell);
  });
  updateStats();
}

function renderTimeline() {
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  const sorted = cases.map((c, i) => ({c, i})).sort((a, b) => parseDate(b.c.date) - parseDate(a.c.date));
  sorted.forEach(({c, i}) => {
    const item = document.createElement('div');
    item.className = 'tl-item' + (marked[i] ? ' marked' : '');
    let sourceHtml = '';
    if (c.sources && c.sources.length) {
      const links = c.sources.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.name}</a>`).join(' · ');
      sourceHtml = `<div class="tl-source">來源：${links}</div>`;
    } else {
      sourceHtml = '<div class="tl-source">來源：私隱署 / 傳媒報道</div>';
    }
    item.innerHTML = `
      <div class="tl-date">${formatDate(c.date)} ${c.suspected ? '· 疑' : ''}</div>
      <div class="tl-name">${c.name.replace(/\n/g, ' ')}</div>
      <div class="tl-detail">${c.detail}${c.impact ? ' · 影響約 ' + c.impact.toLocaleString() + ' 人' : ''}</div>
      <div class="tl-leaked">${c.leaked}</div>
      ${sourceHtml}
    `;
    item.onclick = () => {
      marked[i] = !marked[i];
      renderTimeline();
      updateURL();
    };
    tl.appendChild(item);
  });
  updateStats();
}

function updateStats() {
  const count = marked.filter(Boolean).length;
  document.getElementById('count').textContent = count;
  const bingo = checkBingo();
  document.getElementById('bingoText').classList.toggle('show', bingo);
  updateResult();
}

function checkBingo() {
  if (currentView !== 'bingo') return false;
  const order = getSortedIndices();
  const grid = Array(25).fill(false);
  order.forEach((orig, pos) => { if (marked[orig]) grid[pos] = true; });
  for (let r = 0; r < 5; r++) if (grid.slice(r*5, r*5+5).every(Boolean)) return true;
  for (let c = 0; c < 5; c++) if ([0,1,2,3,4].every(r => grid[r*5 + c])) return true;
  if ([0,6,12,18,24].every(i => grid[i])) return true;
  if ([4,8,12,16,20].every(i => grid[i])) return true;
  return false;
}

function updateResult() {
  const list = document.getElementById('resultList');
  const markedCases = cases.map((c, i) => ({...c, i})).filter(c => marked[c.i]);
  if (markedCases.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:24px;">未有標記任何案件</div>';
    return;
  }
  const typeCount = {};
  markedCases.forEach(c => { getDataTypesForCase(c).forEach(t => { typeCount[t] = (typeCount[t] || 0) + 1; }); });
  let summary = '<div class="type-summary">';
  Object.entries(typeCount).sort((a,b) => b[1]-a[1]).forEach(([type, count]) => {
    summary += `<span class="type-badge">${type} <strong>${count}</strong></span>`;
  });
  summary += '</div>';
  let html = summary;
  markedCases.forEach(c => {
    const types = getDataTypesForCase(c);
    const badges = types.map(t => `<span class="mini-badge">${t}</span>`).join('');
    html += `<div class="result-item">
      <div class="org">${c.name.replace(/\n/g, ' ')}</div>
      <div class="meta">${formatDate(c.date)} · ${c.detail}</div>
      <div class="badges">${badges}</div>
      <div class="leaked">${c.leaked}</div>
    </div>`;
  });
  list.innerHTML = html;
}

function changeSort() { renderGrid(); }
function toggleResult() {
  const panel = document.getElementById('resultPanel');
  const btn = document.getElementById('toggleBtn');
  const btn2 = document.getElementById('toggleBtn2');
  const show = panel.classList.toggle('show');
  const text = show ? '隱藏洩漏資料清單' : '顯示洩漏資料清單';
  if (btn) btn.textContent = text;
  if (btn2) btn2.textContent = text;
}
function updateURL() {
  const state = marked.map(m => m ? '1' : '0').join('');
  history.replaceState(null, '', '#' + btoa(state).replace(/=/g, ''));
}
function loadFromURL() {
  const hash = location.hash.slice(1);
  if (!hash) return;
  try {
    const state = atob(hash);
    for (let i = 0; i < Math.min(state.length, marked.length); i++) marked[i] = state[i] === '1';
  } catch(e) {}
}
function generateReportImage() {
  const canvas = document.createElement('canvas');
  const size = 600;
  canvas.width = size;
  canvas.height = size + 80;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#0c0c0c';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 28px "PingFang HK", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('香港資料外洩 BINGO', size/2, 40);
  const order = getSortedIndices();
  const cellSize = 100;
  const gap = 8;
  const startX = (size - (5*cellSize + 4*gap)) / 2;
  const startY = 70;
  order.forEach((origIdx, pos) => {
    const c = cases[origIdx];
    const r = Math.floor(pos / 5);
    const col = pos % 5;
    const x = startX + col * (cellSize + gap);
    const y = startY + r * (cellSize + gap);
    ctx.fillStyle = marked[origIdx] ? '#ff3b30' : (c.suspected ? '#fff8e7' : '#ffffff');
    ctx.fillRect(x, y, cellSize, cellSize);
    ctx.strokeStyle = marked[origIdx] ? '#ff6b6b' : '#ddd';
    ctx.strokeRect(x, y, cellSize, cellSize);
    ctx.fillStyle = marked[origIdx] ? '#fff' : '#111';
    ctx.font = 'bold 11px "PingFang HK", sans-serif';
    ctx.fillText(c.name.replace(/\n/g, ' '), x + cellSize/2, y + cellSize/2 - 6);
    ctx.font = '10px "PingFang HK", sans-serif';
    ctx.fillStyle = marked[origIdx] ? 'rgba(255,255,255,0.8)' : '#666';
    ctx.fillText(formatDate(c.date), x + cellSize/2, y + cellSize/2 + 10);
  });
  ctx.fillStyle = '#888';
  ctx.font = '14px "PingFang HK", sans-serif';
  ctx.fillText('hk-dataleak.vercel.app', size/2, canvas.height - 30);
  return canvas;
}
function shareResult() {
  const count = marked.filter(Boolean).length;
  const bingo = checkBingo();
  const markedCases = cases.map((c, i) => ({...c, i})).filter(c => marked[c.i]);
  let text = `BINGO! 我中招啦，資料外洩咗。\n標記咗 ${count} 格${bingo ? '，有 Bingo！' : '。'}\n\n`;
  const typeCount = {};
  markedCases.forEach(c => { getDataTypesForCase(c).forEach(t => typeCount[t] = (typeCount[t] || 0) + 1); });
  if (Object.keys(typeCount).length) {
    text += '涉及資料類型：';
    text += Object.entries(typeCount).map(([t, n]) => `${t}(${n})`).join('、') + '\n\n';
  }
  text += '案件清單：\n';
  markedCases.forEach(c => {
    const types = getDataTypesForCase(c).join('、');
    text += `• ${c.name.replace(/\n/g, ' ')}（${formatDate(c.date)}）\n  類型：${types}\n  ${c.leaked}\n\n`;
  });
  text += `玩多幾次：https://hk-dataleak.vercel.app`;
  document.getElementById('shareText').value = text;
  const canvas = generateReportImage();
  const container = document.getElementById('reportImageContainer');
  container.innerHTML = '';
  const img = document.createElement('img');
  img.src = canvas.toDataURL('image/png');
  img.style.maxWidth = '100%';
  img.style.borderRadius = '12px';
  img.style.border = '1px solid #333';
  container.appendChild(img);
  document.getElementById('shareModal').classList.add('show');
}
function copyShare() { navigator.clipboard.writeText(document.getElementById('shareText').value).then(() => alert('已複製文字 + 連結！')); }
function downloadReport() {
  const canvas = generateReportImage();
  canvas.toBlob((blob) => {
    if (!blob) { alert('生成圖片失敗，請再試一次'); return; }
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'hk-dataleak-bingo.png';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, 'image/png');
}
function closeModal() { document.getElementById('shareModal').classList.remove('show'); }
function resetCard() { marked = Array(cases.length).fill(false); renderGrid(); renderTimeline(); updateURL(); }

loadCases();
</script>
